# core 的持续集成。
#
# 只跑 core-test 一个工程：core-test 类路径上只有 gson，几百毫秒出结果，是最便宜的一道闸。
# 二十个平台的模块构建在 build-modules.yml 里（那份是重闸，跑全量矩阵），这里刻意不碰它们 ——
# 但两份守的都是同一条不变量：
#   1) core 只依赖 gson + JDK，一行平台类都不碰（否则跨 1.20.1~26.3 共用的前提就没了）；
#   2) 房间时钟 / 线协议 / 配置钳制的行为不回退（时钟防抖那次被 pull 冲掉就是这么丢的）。

name: core

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    name: core 单元测试 + 平台无关性守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # 先跑最便宜的那道闸：不需要 JDK、不需要联网，几百毫秒出结果。
      - name: 静态检查 core 里不得出现平台 import
        run: |
          if grep -rnE '^[[:space:]]*import[[:space:]]+(net\.minecraft|net\.fabricmc|net\.minecraftforge|net\.neoforged|org\.bukkit|io\.papermc|cpw\.mods|org\.spongepowered)' core/src/main/java; then
            echo "::error::core 出现了平台相关的 import（见上面几行）。core 必须只依赖 gson 与 JDK。"
            exit 1
          fi
          echo "OK: core 未引用任何 Minecraft / loader 类型"

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # 刻意不用 core-test 里的 wrapper：它的 distributionUrl 指向腾讯云镜像（给国内开发机用的），
      # 从 GitHub runner 拉反而慢。CI 直接装同一个 Gradle 版本（与 wrapper 里那个一致）。
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "9.6.1"

      - name: core-test
        working-directory: core-test
        run: gradle test --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-test-report
          path: core-test/build/reports/tests/test
          if-no-files-found: ignore