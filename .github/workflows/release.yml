# 发版：手动触发，构建 20 个模块并把 jar 挂到 GitHub Release。
#
# 为什么只手动（而不是打 tag 自动跑）—— 这是与 README 里「刻意不构建 20 个模块」相反的
# 一个决定，理由值得写清：自动发版意味着往 main 推一个 tag 就会对外产出并上传 20 个 jar，
# 一旦某个模块在这天恰好因为上游抽风（Forge 的 sources 包、loom 快照、mods.toml 展开）
# 编不过，发布就变成了「一半新一半旧」的产物 —— 而不同 core 版本的 jar 混在同一个房间里
# 通信是它最怕的事（build-all.ps1 里那句「实测发生过」）。发版这一步留给人工按下去，
# 先看一眼本机 build-all.ps1 的结论，再来这跑一遍跨环境复核。
#
# 用法：
#   1. 先把 20 个 gradle.properties 的版本号抬到同一个值（check-repo.ps1 会挡不一致）；
#   2. Actions → release → Run workflow；
#   3. version 填 1.4.0，tag 留空会自动建 v1.4.0；要挂到已有 tag 就填 tag。
#
# 产物命名与 build-all.ps1 的汇总口径一致（`<模块>__<jar 名>`）：20 个 jar 平铺在一个
# Release 页面里，1.21.1 与 1.21.11、forge 与 neoforge 很容易看混，模块前缀是唯一能一眼
# 分清来源的东西。README 让服主「挑与服务器完全对应的那一个」，靠的就是这个名字。

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，如 1.4.0（必须与 20 个 gradle.properties 里的值一致）
        required: true
        type: string
      tag:
        description: 要挂到的 tag（留空则自动建 v<version>）
        required: false
        type: string
      draft:
        description: 先存成 draft，人工看过产物再发布
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # 建 Release、传产物

jobs:
  # ── 版本号自检：发版最容易犯的错是「代码是 1.4.0 而某个模块的 gradle.properties 还是 1.3.0」，
  #    而 20 个 jar 混跑不会报错、只在房间里表现为行为不一致。先在便宜的 job 里挡住。
  guard:
    name: 版本号自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 所有模块的版本号必须等于 ${{ inputs.version }}
        run: |
          set -euo pipefail
          want="${{ inputs.version }}"
          bad=()
          for f in */gradle.properties; do
            module=${f%/gradle.properties}
            case "$module" in core-test) continue ;; esac
            got=$(grep -m1 -E '^(mod_version|plugin_version)=' "$f" | cut -d= -f2 | tr -d '[:space:]')
            [ "$got" = "$want" ] || bad+=("$module=$got")
          done
          if [ "${#bad[@]}" -gt 0 ]; then
            echo "::error::这些模块的版本号不是 $want：${bad[*]}（20 个 jar 必须同版，否则房间行为会不一致）"
            exit 1
          fi
          echo "20 个模块的版本号都是 $want"

  build:
    needs: guard
    uses: ./.github/workflows/_build-module.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: 1.20.1fabric,    jdk: "17", gradle: "8.8" }
          - { module: 1.20.1paper,     jdk: "17", gradle: "9.6.1" }
          - { module: 1.21.1fabric,    jdk: "25", gradle: "9.6.1" }
          - { module: 1.21.1paper,     jdk: "21", gradle: "9.6.1" }
          - { module: 1.21.11fabric,   jdk: "25", gradle: "9.6.1" }
          - { module: 1.21.11paper,    jdk: "21", gradle: "9.6.1" }
          - { module: 26.2fabric,      jdk: "25", gradle: "9.6.1" }
          - { module: 26.2paper,       jdk: "25", gradle: "9.6.1" }
          - { module: 26.3fabric,      jdk: "25", gradle: "9.6.1" }
          - { module: 26.3paper,       jdk: "25", gradle: "9.6.1" }
          - { module: 1.20.1neoforge,  jdk: "17", gradle: "8.8" }
          - { module: 1.21.1neoforge,  jdk: "21", gradle: "9.6.1" }
          - { module: 1.21.11neoforge, jdk: "21", gradle: "9.6.1" }
          - { module: 26.2neoforge,    jdk: "25", gradle: "9.6.1" }
          - { module: 26.3neoforge,    jdk: "25", gradle: "9.6.1" }
          - { module: 1.20.1forge,     jdk: "17", gradle: "8.8" }
          - { module: 1.21.1forge,     jdk: "21", gradle: "8.14.4" }
          - { module: 1.21.11forge,    jdk: "21", gradle: "9.6.1" }
          - { module: 26.2forge,       jdk: "25", gradle: "9.6.0" }
          - { module: 26.3forge,       jdk: "25", gradle: "9.6.0" }
    with:
      module: ${{ matrix.module }}
      jdk: ${{ matrix.jdk }}
      gradle: ${{ matrix.gradle }}

  publish:
    name: 建 Release 并上传
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 刻意不 checkout：这一步只需要产物与 git ref 操作，全走 API。少一次克隆，也避开
      # 「浅克隆里 push tag」那类坑。
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      # 汇总成 build-all.ps1 那种 `<模块>__<jar>` 平铺布局：一个目录、一眼看清来源。
      # 顺便再清点一次「20 个都在」——依赖 job 成功已经隐含了，但上传前这道断言很便宜，
      # 而漏传一个 jar 的代价是服主在下载页上找不到与他服务器对应的那一个。
      - name: 汇总产物
        run: |
          set -euo pipefail
          mkdir -p dist
          expected=(
            1.20.1fabric 1.20.1forge 1.20.1neoforge 1.20.1paper
            1.21.1fabric 1.21.1forge 1.21.1neoforge 1.21.1paper
            1.21.11fabric 1.21.11forge 1.21.11neoforge 1.21.11paper
            26.2fabric 26.2forge 26.2neoforge 26.2paper
            26.3fabric 26.3forge 26.3neoforge 26.3paper
          )
          for m in "${expected[@]}"; do
            jar=$(find "artifacts/$m" -maxdepth 1 -name '*.jar' | head -1)
            [ -n "$jar" ] || { echo "::error::$m 没有产物"; exit 1; }
            cp "$jar" "dist/${m}__$(basename "$jar")"
          done
          ls -l dist
          echo "共 $(ls -1 dist | wc -l) 个产物"

      # tag 必须指向**本次正在构建的那个提交**。
      # 不自己管这件事的话，gh release create 在 tag 不存在时会拿**默认分支 HEAD** 现造一个 ——
      # 于是上传的 jar 出自代码 A、tag 指向代码 B。对本仓来说这是最怕的一类不一致
      # （产物与源码对不上、20 个 jar 之间也可能不是同一份 core），所以这里显式判定。
      #
      # 判定要区分三种情况，且**不许猜**：tag 已存在（比提交）、明确不存在（创建）、
      # 以及「不知道」—— gh 的退出码分不开 404 与一次网络抖动（本机实测两者都是退出码 1），
      # 把抖动当成「不存在」去创建，会在最后一步白报一句 already exists。所以：
      # 只在错误信息明确是 404 时才创建，其余非零一律带重试再判，仍不确定就停下让人重跑。
      - name: 确保 tag 指向本次构建的提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag="v$version"
          built="$GITHUB_SHA"

          ref=""; err=""; missing=0
          for attempt in 1 2 3; do
            set +e
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>gh_err.txt)
            rc=$?
            set -e
            err=$(cat gh_err.txt 2>/dev/null || true)
            [ "$rc" -eq 0 ] && break
            if printf '%s' "$err" | grep -q "HTTP 404"; then
              missing=1; break
            fi
            echo "第 $attempt 次查询 tag $tag 失败，重试：$err"
            sleep $((attempt * 3))
          done

          if [ -n "$ref" ]; then
            # 用 gh 自己的 --jq 取字段，不依赖 jq 这个外部命令（runner 上通常有、但没有理由赌它）。
            at=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            # 注解 tag 指向的是 tag 对象而不是提交，得再解一层才知道它落在哪个提交上。
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')" = "tag" ]; then
              at=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$at" --jq '.object.sha')
            fi
            if [ "$at" != "$built" ]; then
              echo "::error::tag $tag 指向 $at，而本次构建的是 $built。想把这次发布挂到 $tag 上，先让 tag 指到这个提交；否则请换一个 tag 名。"
              exit 1
            fi
            echo "tag $tag 已存在且指向本次构建的提交（$built）"
          elif [ "$missing" -eq 1 ]; then
            echo "tag $tag 不存在，按本次构建的提交创建（$built）"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$built" --jq '.ref'
          else
            echo "::error::三次都没能确认 tag $tag 的状态（gh 退出码 $rc：$err）。不在这里猜 —— 重跑这次发布即可。"
            exit 1
          fi

      # 发布说明按版本号生成：从上一个 tag 到现在的提交 + 20 个产物的清单。
      # 版本号带 v 前缀（用户填的是裸版本号，如 1.4.0）——仓库里已有的 1.3.0 tag 不带前缀，
      # 但这里从新版本起统一成 v 前缀，与 README 徽章、官网的写法一致。
      # --verify-tag：tag 必须在，绝不再让 gh 自己现造一个（那正是上面那一步要防的事）。
      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag="v$version"
          # 刻意不传 --latest：那个开关会把「日期最新」直接当成「版本最新」，而本仓完全可能
          # 事后给旧游戏版本补一个修复版（1.21.1 的补丁晚于 26.3 发），那时候「Latest」
          # 应该是谁由 GitHub 按版本号自己判，不该被这次发布强行改掉。
          args=(--title "$tag" --generate-notes --verify-tag)
          # 写成 if 而不是 `[ ... ] && args+=(...)`：后者在条件不成立时**整条 AND-OR 列表**
          # 返回 1，配合上面的 set -e 会让这一步直接失败（draft 选 false 时必现）。
          if [ '${{ inputs.draft }}' = 'true' ]; then
            args+=(--draft)
          fi
          gh release create "$tag" "${args[@]}"

      - name: 上传 20 个 jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag="v$version"
          gh release upload "$tag" dist/*.jar --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'